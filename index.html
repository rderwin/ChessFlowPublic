<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChessFlow</title>
<style>
  :root { --ink:#1d2530; --muted:#5b6675; --accent:#2e7d54; --line:#e6e9ee; --bg:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8ecf2; --muted:#9aa6b6; --accent:#4cc38a; --line:#222a36; --bg:#10141a; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { text-align:center; padding:32px 20px; max-width:520px; }
  h1 { font-size:2rem; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 28px; }
  .links a { display:inline-block; margin:6px; padding:12px 22px; border:1px solid var(--line); border-radius:12px;
             color:var(--accent); text-decoration:none; font-weight:600; }
  .foot { margin-top:30px; color:var(--muted); font-size:.9rem; }
  .foot a { color:var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>♟️ ChessFlow</h1>
    <p>Learn chess with Pip — lessons, openings, endgames, tactics &amp; play.</p>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="support.html">Support</a>
    </div>
    <div class="foot">Questions? <a href="mailto:akiratoriniku@gmail.com">akiratoriniku@gmail.com</a></div>
  </div>
</body>
</html>
